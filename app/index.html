<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Local Chat</title>
<meta name="description" content="Private LAN messaging. No internet, no account.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Right-click context menu -->
<div id="ctx-menu" class="ctx-menu" hidden>
  <button id="ctx-reply">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 17 4 12 9 7"></polyline><path d="M20 18v-2a4 4 0 0 0-4-4H4"></path></svg>
    Reply
  </button>
  <button id="ctx-copy">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
    Copy Text
  </button>
  <div class="ctx-divider"></div>
  <button id="ctx-del" class="ctx-danger">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m5 0V4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2"></path></svg>
    Delete Message
  </button>
</div>

<!-- Image lightbox -->
<div id="lightbox" hidden>
  <div id="lightbox-bg"></div>
  <img id="lightbox-img" alt="Full image preview">
  <button id="lightbox-close">&#x2715;</button>
  <a id="lightbox-open" title="Open in system viewer">&#x2197; Open</a>
</div>

<!-- ONBOARD (full-screen) -->
<section id="onboard" class="full-screen">
  <div class="center">
    <img src="logo.png" class="app-logo" alt="Local Chat">
    <h1>Local Chat</h1>
    <p>Instant messaging on your Wi-Fi.<br>No account. No internet. No data sent.</p>
    <input id="nameIn" placeholder="Enter your display name" maxlength="30" autocomplete="off">
    <button id="nameGo" class="btn-primary">Get Started</button>
  </div>
</section>

<!-- MAIN TWO-PANEL LAYOUT -->
<div id="main-layout" hidden>

  <!-- LEFT SIDEBAR -->
  <aside id="sidebar">

    <!-- Sidebar top: my avatar + app name + nav icons -->
    <div id="sidebar-top">
      <div id="my-av" class="av" title="My profile"></div>
      <span id="my-name-label" class="grow">Local Chat</span>
      <button class="nav-btn nav-active" data-go="home" id="nav-home" title="Chats">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
      </button>
      <button class="nav-btn" data-go="nearby" id="nav-nearby" title="Nearby Devices">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="2"></circle><path d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49m11.31-2.82a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14"></path></svg>
      </button>
      <button class="nav-btn" data-go="group" id="nav-group" title="New Group">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
      </button>
      <button class="nav-btn" data-go="set" id="nav-settings" title="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </button>
    </div>

    <!-- HOME: search + chat list -->
    <section id="home" class="left-view active">
      <div id="search-wrap">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="search-icon"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input id="searchIn" placeholder="Search chats…" autocomplete="off">
      </div>
      <div id="list" class="scroll"></div>
    </section>

    <!-- NEARBY -->
    <section id="nearby" class="left-view">
      <div class="left-sub-header">
        <button data-go="home" class="back-btn" title="Back">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 5l-7 7 7 7"></path></svg>
        </button>
        <span>Nearby Devices</span>
      </div>
      <div id="nearList" class="scroll"></div>
    </section>

    <!-- GROUP -->
    <section id="group" class="left-view">
      <div class="left-sub-header">
        <button data-go="home" class="back-btn" title="Back">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 5l-7 7 7 7"></path></svg>
        </button>
        <span>New Group</span>
      </div>
      <div class="pad"><input id="gName" placeholder="Group name" maxlength="40" autocomplete="off"></div>
      <div id="gList" class="scroll"></div>
      <div class="pad"><button id="gGo" class="btn">Create Group</button></div>
    </section>

    <!-- SETTINGS -->
    <section id="set" class="left-view">
      <div class="left-sub-header">
        <button data-go="home" class="back-btn" title="Back">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 5l-7 7 7 7"></path></svg>
        </button>
        <span>Settings</span>
      </div>
      <div class="scroll pad">
        <div id="my-profile-card">
          <div id="my-profile-av" class="av"></div>
          <div class="profile-info">
            <div id="my-profile-name">—</div>
            <label id="photo-change-label">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
              Change Photo
              <input type="file" id="sPhoto" accept="image/*" hidden>
            </label>
          </div>
        </div>
        <label>Display name</label>
        <input id="sName" maxlength="30" autocomplete="off">
        <button id="sSave" class="btn">Save Name</button>
        <label>Theme</label>
        <button id="thm" class="btn alt">Switch Light / Dark</button>
        <h3>Blocked Users</h3>
        <div id="blk"></div>
      </div>
    </section>

  </aside>

  <!-- RIGHT PANEL -->
  <main id="right-panel">

    <!-- Welcome screen -->
    <div id="welcome-screen">
      <div class="welcome-inner">
        <img src="logo.png" class="app-logo app-logo-sm" alt="Local Chat">
        <h2>Local Chat</h2>
        <p>Select a conversation or find someone<br>nearby to start chatting.</p>
        <small>Encrypted by your LAN — no data leaves your network.</small>
      </div>
    </div>

    <!-- Active Chat -->
    <section id="chat" hidden>
      <header id="chat-header">
        <button id="chat-back" class="back-btn mobile-only" title="Back">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 5l-7 7 7 7"></path></svg>
        </button>
        <div id="chat-av-wrap"></div>
        <div id="chatHead" class="grow"></div>
        <button id="bBlock">Block</button>
      </header>
      <div id="msgs" class="scroll"></div>
      <div id="replyBar" hidden></div>
      <button id="scrollDown" hidden title="Jump to latest">&#x2193;</button>
      <footer>
        <button id="attach" title="Attach file">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
        </button>
        <input type="file" id="fileIn" hidden>
        <textarea id="txt" rows="1" placeholder="Type a message…"></textarea>
        <button id="cancel" hidden title="Cancel recording">&#x2715;</button>
        <button id="mic" title="Voice message">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
        </button>
        <button id="sendBtn" class="go" hidden>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M2 21l21-9-21-9v7l15 2-15 2z"></path></svg>
        </button>
      </footer>
    </section>

  </main>
</div>

<script src="app.js"></script>
</body>
</html>
